# ============================================================
# 記事の分類・重要度判定に使うキーワード
# ------------------------------------------------------------
# ・各キーワードは「正規表現」として扱われます（普通の言葉ならそのまま書けばOK）。
#   例) 宮古(?!島)  → 「宮古」には当てはまるが「宮古島」には当てはまらない
# ・weight が大きいほど重要度スコアが上がります。
# ・記事タイトル＋概要に当てはまったキーワードの weight を合計してスコアにします。
# ============================================================

# 判定前に本文から取り除く語（誤検出防止）
exclude:
  - 漁夫の利
  - スイカ
  - イカゲーム
  - イカす
  - サバイバル
  - サバゲー
  - ブリーフ
  - ブリッジ
  - ブリック
  - タラップ
  - マスク
  - マスコミ
  - マスター
  - クリスマス
  - 宮古島
  - 宮古毎日
  - 漁る

# 水産関連と判定するための語（filter: true の取得元では、これに1つも当たらない記事は捨てる）
fishery_core:
  - 漁業
  - 漁協
  - 漁連
  - 漁港
  - 漁船
  - 漁獲
  - 漁場
  - 漁師
  - 漁期
  - 漁況
  - 出漁
  - 不漁
  - 豊漁
  - 密漁
  - 休漁
  - 水産
  - 水揚げ
  - 魚市場
  - 養殖
  - 定置網
  - 種苗
  - ふ化
  - 稚魚
  - 稚貝
  - 放流
  - 魚種
  - 鮮魚
  - 海業
  - 秋サケ
  - サケ(?!ー)
  - サンマ
  - スルメイカ
  - (?<![スハ])イカ(?![ーゲサラ])
  - ワカメ
  - 昆布|コンブ
  - アワビ
  - ウニ
  - ナマコ
  - ホタテ
  - 牡蠣|カキ(?![氷込])
  - ホヤ
  - サバ(?![イゲ])
  - イワシ
  - マダラ|スケトウダラ
  - ブリ(?![ーッュィ])
  - サクラマス|トラウトサーモン|ギンザケ|銀鮭|サーモン養殖
  - 貝毒

# 地域（岩手県・三陸）
areas:
  - id: iwate
    label: 岩手・三陸
    weight: 10
    patterns:
      - 岩手
      - 三陸
      - 宮古(?!島)
      - 釜石
      - 大船渡
      - 久慈
      - 陸前高田
      - 山田町
      - 大槌
      - 岩泉
      - 田野畑
      - 普代
      - 野田村
      - 洋野
      - 種市
      - 重茂
      - 田老
      - 広田湾
      - 越喜来
      - 綾里
      - 吉浜
      - 唐丹
      - 盛岡
  - id: tohoku
    label: 東北太平洋側
    weight: 3
    patterns:
      - 宮城
      - 気仙沼
      - 石巻
      - 女川
      - 青森
      - 八戸
      - 福島
      - 東北

# 分野（ページ上の絞り込みボタンになります）
categories:
  - id: org
    label: 漁連・漁協
    weight: 12
    patterns:
      - 漁連
      - 漁業協同組合
      - 漁協
      - 全漁連
      - JF(?=[ 　]?[一-龥ァ-ヶ])
      - 信漁連
      - 漁業共済
      - 漁船保険
      - 漁協長

  - id: salmon
    label: サケ・マス
    weight: 8
    patterns:
      - 秋サケ
      - サケ(?!ー)
      - 鮭
      - ふ化
      - 稚魚
      - 回帰
      - サクラマス
      - トラウトサーモン
      - ギンザケ
      - 銀鮭
