name: ニュース更新

on:
  schedule:
    # 毎朝 6:07 JST（= 21:07 UTC）に起動。GitHub の定時実行は混雑時に数十分遅れることがあるため、
    # 7時までに更新が終わるよう早めに起動しています。
    - cron: "7 21 * * *"
  workflow_dispatch:   # 手動実行（Actions 画面の「Run workflow」／ページの「今すぐ更新」）
    inputs:
      report_days:
        description: "作成する Word 報告書（1=日報 / 7=週報 / 30=月報）"
        type: choice
        options: ["1", "7", "30", "1 7 30"]
        default: "1"

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存パッケージのインストール
        run: pip install -r requirements.txt

      - name: ニュース収集
        env:
          TZ: Asia/Tokyo
        run: python scripts/collect.py

      - name: Word 報告書の作成
        env:
          TZ: Asia/Tokyo
          # 任意：リポジトリの Secrets に ANTHROPIC_API_KEY を登録すると「AIによる概況まとめ」が付きます
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          DAYS="${{ github.event.inputs.report_days }}"
          if [ -z "$DAYS" ]; then
            # 定時実行：毎日は日報、月曜は週報、1日は月報も作る
            DAYS="1"
            [ "$(date +%u)" = "1" ] && DAYS="$DAYS 7"
            [ "$(date +%d)" = "01" ] && DAYS="$DAYS 30"
          fi
          python scripts/report.py --days $DAYS

      - name: 結果をコミット
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/reports
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "ニュース更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          # push すると GitHub Pages（main の /docs から公開）が自動で再構築されます
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
