name: ニュース更新

on:
  schedule:
    # 毎朝 6:50 JST（= 21:50 UTC）に起動。GitHub の定時実行は数分〜十数分遅れることがあるため、
    # 7時ごろに更新が終わるよう少し早めに起動しています。
    - cron: "50 21 * * *"
  workflow_dispatch:   # 手動実行（Actions 画面の「Run workflow」／ページの「今すぐ更新」）

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存パッケージのインストール
        run: pip install -r requirements.txt

      - name: ニュース収集
        env:
          TZ: Asia/Tokyo
        run: python scripts/collect.py

      - name: 結果をコミット
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "ニュース更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
